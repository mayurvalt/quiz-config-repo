spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/quiz_service_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Resilience4j circuit breaker
resilience4j.circuitbreaker.instances.questionService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.questionService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.questionService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.questionService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.questionService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.questionService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.questionService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Retry
spring.retry.max-attempts=3
spring.retry.backoff.delay=2000
spring.retry.backoff.multiplier=2.0

# TimeLimiter
resilience4j.timelimiter.instances.quizService.timeoutDuration=2s
resilience4j.timelimiter.instances.quizService.cancelRunningFuture=true
